name: CD Pipeline

on:
  push:
    branches: ["main"]

  workflow_dispatch: {}

# The runner is on the production VM, so two overlapping runs would race on
# `docker compose up -d` for the same containers. Serialize deploys.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on:
      group: OpenStack
      labels: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: cogitontnu
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Image and push to GitHub Container Registry
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ghcr.io/cogitontnu/cogi-go:latest

      # The runner lives on the production VM, so the freshly built image is
      # already in the local docker daemon. The compose file under
      # /home/cogito-web-backend carries the real environment (secrets included),
      # which is why no .env needs to be materialized here.
      - name: Deploy backend
        run: docker compose -f /home/cogito-web-backend/docker-compose.yml up -d
